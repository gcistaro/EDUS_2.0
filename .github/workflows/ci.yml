name: EDUS CI (dependency discovery)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Show environment (VERY IMPORTANT for debugging)
      - name: Inspect system
        run: |
          echo "=== COMPILER ==="
          g++ --version || true
          echo "=== CMAKE ==="
          cmake --version || true
          echo "=== PYTHON ==="
          python3 --version || true

      # 3. Install ONLY minimal build tools
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libopenmpi-dev \
            openmpi-bin \
            libhdf5-dev \
            libfftw3-dev \
            libfftw3-mpi-dev \
            libopenblas-dev \
            liblapack-dev \
            liblapacke-dev            


      # 4. Clone Spack (but DO NOT install heavy deps yet)
      - name: Clone Spack
        run: git clone --depth=1 https://github.com/spack/spack.git $HOME/spack

      # 5. Register your local Spack repo (safe, no installs yet)
      - name: Register Spack repo
        run: |
          . $HOME/spack/share/spack/setup-env.sh
          spack repo add $GITHUB_WORKSPACE/spack || true
          spack repo list

      # 6. Configure project (this is where missing deps will show)
      - name: Configure CMake
        run: |
          cmake -S . -B build

      # 7. Build (will likely fail if dependencies missing — GOOD!)
      - name: Build project
        run: |
          cmake --build build -j$(nproc)

######      # 8. Run tests (if build succeeds)
######      - name: Run CTest
######        run: |
######          ctest --test-dir build --output-on-failure